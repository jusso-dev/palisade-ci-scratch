# Scratch CI: Windows-only experiments for jusso-dev/palisade work in progress.
name: scratch
on:
  push:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OS signer probe
        shell: powershell
        run: |
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scratch/probe.ps1
      - run: rustup toolchain install
      - name: differential test
        run: cargo test -p palisade-fileid --test script os_trust_verification_agrees -- --nocapture
