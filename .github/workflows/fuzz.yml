# Weekly fuzzing: every cargo-fuzz target for 30 minutes, one job each. The
# `fuzz` job in ci.yml runs the same targets for 60 s on every pull request.
# A finding fails the job, and the job summary shows it with a base64
# reproducer (docs/testing.md#fuzzing).
name: Scheduled fuzzing

on:
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        # Every target of every project in xtask/src/fuzz.rs; a unit test
        # there keeps this list complete. Target names are unique across
        # projects, so `--target` alone selects the project.
        target: [pe_parse, version_info_parse, authenticode_ranges, authenticode_pkcs7, fsctx_parse, x509_chain, timestamp_crl, fuzz_ctl, fuzz_classify, script_sig, trust_set_decode]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Keep in step with TOOLCHAIN in xtask/src/fuzz.rs.
      - run: rustup toolchain install nightly-2026-11-20 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Scheduled runs are on main; they only read the cache.
          save-if: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz@0.13.2
          fallback: cargo-install
      - env:
          TARGET: ${{ matrix.target }}
        run: cargo xtask fuzz --seconds 1800 --target "$TARGET"

  # Opens a tracking issue when a target fails, or comments on the open one.
  # Only this job can write issues; it runs no repository code.
  report:
    needs: fuzz
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "Scheduled fuzzing found a failure"
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the tracking issue
        run: |
          body="A scheduled fuzz target failed. The run's job summary has the failing input and how to reproduce it: $RUN_URL"
          number=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=area:security&per_page=100" \
            --jq '[.[] | select(.pull_request == null and .title == env.TITLE)][0].number // empty')
          if [ -n "$number" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
            echo "Commented on #$number"
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" -f body="$body" \
              -f 'labels[]=area:security' --jq '"Opened #\(.number)"'
          fi
